<svg xmlns="http://www.w3.org/2000/svg" width="840" height="283" viewBox="0 0 840 283" role="img" aria-labelledby="title"><title id="title">Get ready for an appointment</title><rect x="2" y="2" width="836" height="279" rx="22" fill="#fff" stroke="#aebfba" stroke-width="1.5"/><text x="30" y="51" font-family="Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#21312f" text-anchor="start">Get ready for an appointment</text><text x="30" y="80" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4d635e" text-anchor="start">Follow one step at a time.</text><rect x="30" y="110" width="253" height="139" rx="15" fill="#edf5f1" stroke="#aebfba" stroke-width="1.5"/><path transform="translate(46 123) scale(1.4166666666666667)" d="M12 4a8 8 0 1 0 .01 0M12 8v5l3 2" fill="none" stroke="#275b51" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"/><text x="252" y="148" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#21312f" text-anchor="middle">1</text><text x="46" y="183" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#21312f" text-anchor="start">Check the time and</text><text x="46" y="208" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#21312f" text-anchor="start">address</text><rect x="293" y="110" width="253" height="139" rx="15" fill="#edf5f1" stroke="#aebfba" stroke-width="1.5"/><path transform="translate(309 123) scale(1.4166666666666667)" d="M12 4a8 8 0 1 0 .01 0M12 8v5l3 2" fill="none" stroke="#275b51" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"/><text x="515" y="148" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#21312f" text-anchor="middle">2</text><text x="309" y="183" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#21312f" text-anchor="start">Pack what you need to</text><text x="309" y="208" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#21312f" text-anchor="start">bring</text><rect x="556" y="110" width="253" height="139" rx="15" fill="#edf5f1" stroke="#aebfba" stroke-width="1.5"/><path transform="translate(572 123) scale(1.4166666666666667)" d="M12 4a8 8 0 1 0 .01 0M12 8v5l3 2" fill="none" stroke="#275b51" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"/><text x="778" y="148" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#21312f" text-anchor="middle">3</text><text x="572" y="183" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#21312f" text-anchor="start">Set a time to leave</text></svg>
